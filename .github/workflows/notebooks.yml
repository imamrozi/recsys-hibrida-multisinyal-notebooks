name: notebooks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  jalankan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Pasang dependensi (torch versi CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Eksekusi semua notebook (asersi di dalam sel menguji klaim)
        run: |
          set -e
          for nb in $(find notebooks -name "*.ipynb" | sort); do
            echo "=== $nb"
            jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=600 \
              --output-dir /tmp/out "$nb"
          done
